<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clear the stale</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; padding: 16px 16px 24px; background: #121416; color: #f1f1f1; font-family: Inter, system-ui, sans-serif; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 8px">
    <a href="Mobile.dc.html" aria-label="Back to Saved" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; color: #c2c8bf; text-decoration: none">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg>
    </a>
    <div style="flex-grow: 1; font-size: 14px; font-weight: 600; color: #e0b866">Going stale</div>
    <div style="font-size: 14px; color: #949b92">1 of 3</div>
  </div>

  <!-- Progress -->
  <div style="display: flex; gap: 6px; padding: 8px 4px 0">
    <div style="flex: 1; height: 4px; border-radius: 2px; background: #accfae"></div>
    <div style="flex: 1; height: 4px; border-radius: 2px; background: #2e3132"></div>
    <div style="flex: 1; height: 4px; border-radius: 2px; background: #2e3132"></div>
  </div>

  <!-- Card -->
  <div style="flex-grow: 1; min-height: 0; margin-top: 24px; padding: 24px; border-radius: 20px; background: #1e2022; border: 1px solid rgba(66,72,65,0.5); display: flex; flex-direction: column">
    <div style="font-size: 13px; color: #949b92">Build Log · 17 min</div>
    <h1 style="margin: 12px 0 0; font-family: 'Noto Serif', Georgia, serif; font-size: 26px; font-weight: 600; line-height: 1.2; letter-spacing: -0.01em">A field guide to local-first sync</h1>
    <p style="margin: 14px 0 0; font-size: 15px; line-height: 1.6; color: #c2c8bf">Conflict resolution, offline queues, and the tradeoffs between CRDTs and simple last-write-wins.</p>

    <div style="margin-top: 20px; padding: 14px 16px; border-radius: 12px; background: #1a1c1e; display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 13px; color: #e0b866; font-weight: 600">Saved 4 weeks ago</div>
      <div style="font-size: 13px; color: #949b92">Never opened · no highlights</div>
    </div>

    <div style="flex-grow: 1"></div>
    <div style="font-size: 13px; line-height: 1.5; color: #949b92">Still want this? If it hasn't pulled you back in a month, it probably won't.</div>
  </div>

  <!-- Actions -->
  <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 10px">
    <button style="min-height: 52px; border-radius: 14px; border: none; background: #accfae; color: #03210b; font-size: 16px; font-weight: 600">Read it now</button>
    <div style="display: flex; gap: 10px">
      <button style="flex: 1; min-height: 52px; border-radius: 14px; border: 1px solid rgba(66,72,65,0.8); background: transparent; color: #f1f1f1; font-size: 15px; font-weight: 500">Keep 30 more days</button>
      <button style="flex: 1; min-height: 52px; border-radius: 14px; border: none; background: #2e3132; color: #f1f1f1; font-size: 15px; font-weight: 500">Let it go</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
